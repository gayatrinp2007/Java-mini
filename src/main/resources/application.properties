spring.application.name=certificate-verification-system
server.port=8080

# H2 file database: data remains available after the application is restarted.
spring.datasource.url=jdbc:h2:file:./data/certificatesdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
